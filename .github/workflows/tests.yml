name: UI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Test marker to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - e2e
          - all

permissions:
  contents: write
  pages: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Prepare results directory
        if: always()
        run: |
          rm -rf allure-results
          mkdir -p allure-results

      - name: Restore Allure history
        if: always() && (github.event_name == 'push' || inputs.marker == 'all')
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ inputs.marker || 'all' }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-${{ inputs.marker || 'all' }}-
            allure-history-${{ github.ref_name }}-
            allure-history-

      - name: Copy history to results
        if: always() && hashFiles('allure-history/**') != ''
        run: |
          mkdir -p allure-results/history
          cp -r allure-history/* allure-results/history/ || true

      - name: Run smoke tests (sequential)
        if: always() && (github.event_name == 'push' || inputs.marker == 'smoke' || inputs.marker == 'all')
        run: |
          echo "▶ Stage 1: Smoke tests"
          pytest -m smoke -v --alluredir=allure-results

      - name: Run regression + e2e (4 workers)
        if: always() && (github.event_name == 'push' || inputs.marker == 'regression' || inputs.marker == 'e2e' || inputs.marker == 'all')
        run: |
          echo "▶ Stage 2: Regression + E2E"
          
          # Если запускается ТОЛЬКО regression или e2e (без smoke), очищаем папку от возможных артефактов
          if [ "${{ inputs.marker }}" == "regression" ] || [ "${{ inputs.marker }}" == "e2e" ]; then
            rm -rf allure-results
            mkdir -p allure-results
            PYTEST_MARKER="${{ inputs.marker }}"
          else
            PYTEST_MARKER="(regression or e2e) and not smoke"
          fi
          
          pytest -m "$PYTEST_MARKER" -v -n 4 --dist loadfile --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Save Allure history for next run
        if: always() && (github.event_name == 'push' || inputs.marker == 'all')
        run: |
          mkdir -p allure-history
          rm -rf allure-history/*
          cp -r allure-report/history/* allure-history/ || true

      - name: Cache Allure history
        if: always() && (github.event_name == 'push' || inputs.marker == 'all')
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ inputs.marker || 'all' }}-${{ github.run_id }}

      - name: Upload Allure report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Add report link to summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKER="${{ inputs.marker }}"
          else
            MARKER="all" 
          fi
          
          if [ "$MARKER" = "smoke" ]; then
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          elif [ "$MARKER" = "all" ]; then
            date
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$MARKER/"
          fi
          
          echo "## 🔗 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Marker:** \`$MARKER\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report:** [$URL]($URL)" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true