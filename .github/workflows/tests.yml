name: UI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Test marker to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - e2e
          - all

# Обязательные права для работы официального деплоя Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Предотвращает одновременные деплои, чтобы они не перезаписывали друг друга
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      # --- ЗАПУСК ТЕСТОВ ---

      - name: Prepare results directory
        if: always()
        run: |
          rm -rf allure-results
          mkdir -p allure-results

      - name: Run smoke tests (sequential)
        if: always() && (github.event_name == 'push' || inputs.marker == 'smoke' || inputs.marker == 'all')
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.marker }}" == "all" ]; then
            echo "▶ Stage 1: Smoke tests (part of the 'all' run)"
          else
            echo "▶ Running tests with marker: smoke"
          fi
          pytest -m smoke -v --alluredir=allure-results

      - name: Run regression + e2e (4 workers)
        if: always() && (github.event_name == 'push' || inputs.marker == 'regression' || inputs.marker == 'e2e' || inputs.marker == 'all')
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.marker }}" == "all" ]; then
            echo "▶ Stage 2: Regression + E2E (excluding smoke)"
            PYTEST_MARKER="(regression or e2e) and not smoke"
          else
            echo "▶ Running tests with marker: ${{ inputs.marker }}"
            PYTEST_MARKER="${{ inputs.marker }}"
            # Очищаем папку, так как smoke не запускался
            rm -rf allure-results
            mkdir -p allure-results
          fi
          pytest -m "$PYTEST_MARKER" -v -n 4 --dist loadfile --alluredir=allure-results

      # --- ГЕНЕРАЦИЯ ОТЧЕТА ---

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean
          # Создаем .nojekyll, чтобы GitHub Pages не игнорировал папки, начинающиеся с "_"
          touch allure-report/.nojekyll

      - name: Upload Allure report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Add report link to summary
        if: always()
        run: |
          
          if [ "${{ github.event_name }}" == "push" ]; then
            MARKER="all"
          else
            MARKER="${{ inputs.marker }}"
          fi

          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          echo "## 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Executed Marker:** \`$MARKER\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "You can view the full report here: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY


      - name: Setup Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4